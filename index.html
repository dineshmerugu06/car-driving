<script>
  // Error trap: failures are NEVER a silent black screen.
  window.__errors = [];
  window.__showError = function (msg) {
    window.__errors.push(String(msg));
    var box = document.getElementById('errbox');
    if (!box) {
      box = document.createElement('div');
      box.id = 'errbox';
      box.style.cssText = 'position:fixed;left:12px;bottom:12px;z-index:99;max-width:92vw;background:#b00020;color:#fff;font:600 13px/1.5 system-ui,sans-serif;padding:10px 14px;border:3px solid #121212;white-space:pre-wrap;';
      document.body.appendChild(box);
    }
    box.textContent = '⚠ Something failed to load:\n' + window.__errors.slice(-3).join('\n');
    box.style.display = 'block';
  };
  window.addEventListener('error', function (e) {
    if (e.message) window.__showError(e.message);
  });
  window.addEventListener('unhandledrejection', function (e) {
    window.__showError('Promise failed: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
</script>
